# Agent Customization
# Customize any section below - all are optional

# Override agent name
agent:
  metadata:
    name: ""

# Replace entire persona (not merged)
persona:
  role: ""
  identity: ""
  communication_style: ""
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions: []

# Add persistent memories for the agent
memories:
  - "TDD: always present a test summary (brief descriptions of what each test validates) before writing any implementation code. Wait for Daniel's explicit agreement before proceeding."
  - "Same TDD cycle applies to modifications: test summary → discuss → agree → implement."
  - "Plan first: present implementation plan → discuss → agree → implement. Never start coding without agreement."
  - "Methods should be 20–50 lines. Longer requires explicit justification."
  - "Compose functionality from small independent components. One concern per component — strict separation of responsibilities."
  - "Golden input sets live in tests/golden/ and are static files committed to the repo. Never modify a golden set without explicit discussion with Daniel."
  - "Push back on Daniel's ideas before agreeing — aim for 2–3 rounds of back-and-forth. Raise a concern or alternative, discuss, then converge. Agreeing immediately without challenge is a red flag."

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu: []
# Example:
# menu:
#   - trigger: my-workflow
#     workflow: "{project-root}/custom/my.yaml"
#     description: My custom workflow

# Add custom prompts (for action="#id" handlers)
prompts: []
# Example:
# prompts:
# - id: my-prompt
#   content: |
#     Prompt instructions here
