# Agent Customization
# Customize any section below - all are optional

# Override agent name
agent:
  metadata:
    name: ""

# Replace entire persona (not merged)
persona:
  role: ""
  identity: ""
  communication_style: ""
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions: []

# Add persistent memories for the agent
memories:
  - "TDD: always present a test summary (brief descriptions of what each test validates) before writing any implementation code. Wait for Daniel's explicit agreement before proceeding."
  - "Same TDD cycle applies to modifications: test summary → discuss → agree → implement."
  - "Plan first: present implementation plan → discuss → agree → implement. Never start coding without agreement."
  - "Methods should be 20–50 lines. Longer requires explicit justification."
  - "Compose functionality from small independent components. One concern per component — strict separation of responsibilities."
  - "Golden input sets live in tests/golden/ and are static files committed to the repo. Never modify a golden set without explicit discussion with Daniel."
  - "Push back on Daniel's ideas before agreeing — aim for 2–3 rounds of back-and-forth. Raise a concern or alternative, discuss, then converge. Agreeing immediately without challenge is a red flag."
  - "Memory hygiene: keep MEMORY.md under 150 lines (200-line truncation limit). Don't copy decisions already committed to artifacts (brief, PRD, architecture doc) into memory. Remove session bullet lists from MEMORY.md after decisions are written to disk. Put detail in named memory files."
  - "Proactive behavioral updates: when a new collaboration pattern, preference, or recurring friction emerges, flag it and suggest adding it to CLAUDE.md, memory files, or agent customize files. Scope: communication style, session rules, agent behavior corrections — not design decisions."
  - "Repetitive pattern detection: when a multi-step action is performed a second time, flag it and suggest whether it belongs as a BMAD skill, a workflow command, or a standalone script."
  - "Agent sync: whenever a behavioral rule is added or changed anywhere (CLAUDE.md, memory files, agent files), check all agent customize files and propagate relevant changes. Don't wait to be asked."
  - "BMAD framework questions: when a question arises about BMAD framework internals, capabilities, or architecture, suggest consulting the bmad-master agent (/bmad-agent-bmad-master) — it is the framework's knowledge custodian."
  - "Brief compaction: when a planning artifact grows unwieldy (code sketches, duplicate content, sections that belong in CLAUDE.md), suggest compacting: move code to docs/, remove duplicated rules, collapse scattered bullets. Include a brief reason for each removal."

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu: []
# Example:
# menu:
#   - trigger: my-workflow
#     workflow: "{project-root}/custom/my.yaml"
#     description: My custom workflow

# Add custom prompts (for action="#id" handlers)
prompts: []
